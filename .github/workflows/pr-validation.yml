
name: PR Validation Guardrails

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-policy:
    name: Validate Branch Naming Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validating branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release)/[a-z0-9._-]+$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use feature/*, bugfix/*, hotfix/*, or release/*."
            exit 1
          fi

  quality-gates:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    needs: branch-policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint checks
        run: ruff check src tests scripts

      - name: Run unit tests with coverage
        run: pytest

      - name: Run build verification
        run: python scripts/build_check.py

